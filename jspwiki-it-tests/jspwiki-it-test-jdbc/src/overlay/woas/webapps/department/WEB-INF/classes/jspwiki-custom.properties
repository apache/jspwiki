#
# Overriding values on classpath:/ini/jspwiki.properties
#

jspwiki.applicationName=department

#jspwiki.pageProvider=VersioningFileProvider
jspwiki.workDir=${catalina.base}/temp/department

jspwiki.attachment.forbid=.html .htm .php .asp .exe .sh .dll
jspwiki.attachment.maxsize=4000000
jspwiki.breakTitleWithSpaces=true
jspwiki.searchProvider=LuceneSearchProvider
jspwiki.security=jaas
jspwiki.cache.enable=true
jspwiki.cache.config-file=ehcache-woas-department.xml

jspwiki.xmlGroupDatabaseFile=${catalina.base}/webapps/department/WEB-INF/groupdatabase.xml
jspwiki.xmlUserDatabaseFile=${catalina.base}/webapps/department/WEB-INF/userdatabase.xml

log4j.appender.FileLog.File=./logs/jspwiki.log

jspwiki.pageProvider = org.apache.wiki.providers.JdbcPageProvider
jspwiki.jdbcPageProvider.autoCreateSchema = true
#jspwiki.jdbcPageProvider.preloadFrom.provider - defaults to versioning file provider
jspwiki.jdbcPageProvider.preloadFrom.attachmentDir=${catalina.base}/data/department
#jspwiki.jdbcPageProvider.preloadFrom.attachmentProvider = defaults to file provider
jspwiki.jdbcPageProvider.preloadFrom.pageDir=${catalina.base}/data/department

jspwiki.attachment.provider = org.apache.wiki.providers.JdbcAttachmentProvider
jspwiki.jdbcAttachmentProvider.dataSource = java:comp/env/jdbc/WikiDS
# Optional:
# jspwiki.basicAttachmentProvider.disableCache = .*\.xlsx

# Option A: Direct JDBC URL (SQLite / PostgreSQL / MariaDB / MSSQL)
jspwiki.jdbcPageProvider.url = jdbc:sqlite://${catalina.base}/conf/jspwiki.db

# Option B: Container/App-managed DataSource via JNDI (recommended for production pools)
# so in tomcat, the connection specifics go in wiki/META-INF/context.xml
# jspwiki.jdbcPageProvider.jndiName = java:comp/env/jdbc/JSPWikiDB

# more efficient searches, however turn off if you use some kind of obfuscation algorithm
jspwiki.jdbcPageProvider.searchPreFilter = true