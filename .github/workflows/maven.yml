name: Java CI

on: [push, pull_request]

#pull reqquest write is for adding comments to a PR
permissions:
  pull-requests: write
  contents: read

jobs:
  build:

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        # All LTS versions plus the current version, , 
        java: [ 17, 21, 25 ]
        experimental: [false]
#        include:
#          - java: 20-ea
#            os: ubuntu-latest
#            experimental: true        
#          - java: 20-ea
#            os: windows-latest
#            experimental: true        
#          - java: 20-ea
#            os: macos-latest
#            experimental: true        
      fail-fast: false
        
    steps:
    - uses: actions/checkout@v3
    - uses: actions/cache@v3
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}
    - name: Build with Maven
      run: mvn clean package -T 1C -V -B -Pintegration-tests -Dminimize=false "-Dplugin.surefire.junit5-tree-reporter.enable-console=true"
#    - name: Dependency scan
#      run: mvn org.sonatype.ossindex.maven:ossindex-maven-plugin:LATEST:audit
# token required
# Disabled due to some bug in the plugin
#    - name: Dependency scan
#      run: mvn install -B -T 1C -DskipTests=true org.owasp:dependency-check-maven:LATEST:check -DassemblyAnalyzerEnabled=false
    - name: generate jacoco aggregated
      run: mvn -Pgithubjacoco verify -N

      # --- Native Bash Script to Parse XML and create GitHub Summary ---
    - name: Generate Code Coverage Summary
      if: always() && runner.os == 'Linux'
      run: |
        REPORT_PATH="${{ github.workspace }}/target/site/jacoco-aggregate/jacoco.xml"
        
        if [ ! -f "$REPORT_PATH" ]; then
          echo "::error::JaCoCo XML report not found at $REPORT_PATH"
          exit 1
        fi
        # 1. Grab ALL global report counters located strictly inside the final </report> scope
        # The global project totals are always the very last <counter> entries before the closing </report> tag.
        GLOBAL_COUNTERS=$(grep '<counter type="LINE"' "$REPORT_PATH" | tail -n 1)

        if [ -z "$GLOBAL_COUNTERS" ]; then
           echo "::error::Could not find global Line Counter in JaCoCo XML"
           exit 1
        fi

        # 2. Extract values cleanly from the global project counter element
        python3 -c "
          import xml.etree.ElementTree as ET
          import os

          try:
              # Initialize counters
              total_missed = 0
              total_covered = 0
              
              # Parse the XML safely
              tree = ET.parse('$REPORT_PATH')
              root = tree.getroot()
              
              # Strategy: Find every <package> node, and grab its immediate <counter type='LINE'> child.
              # This bypasses method/class duplication and scales perfectly to 90k+ lines.
              for package in root.findall('.//package'):
                  line_counter = package.find(\"./counter[@type='LINE']\")
                  if line_counter is not None:
                      total_missed += int(line_counter.get('missed', 0))
                      total_covered += int(line_counter.get('covered', 0))
              
              total_lines = total_missed + total_covered
              
              if total_lines == 0:
                  print('::error::Calculated 0 total lines. Checking alternative fallback layout...')
                  # Fallback: If no package-level counters, look for root-level direct children counters
                  for counter in root.findall(\"./counter[@type='LINE']\"):
                      total_missed = int(counter.get('missed', 0))
                      total_covered = int(counter.get('covered', 0))
                      total_lines = total_missed + total_covered

              percentage = round((total_covered / total_lines) * 100, 2) if total_lines > 0 else 0.0
              
              # Write directly to the GitHub step summary file
              summary_file = os.environ.get('GITHUB_STEP_SUMMARY')
              with open(summary_file, 'a', encoding='utf-8') as f:
                  f.write('### 📊 Precision Project Code Coverage Summary\n\n')
                  f.write('| Metric | Value |\n')
                  f.write('| --- | --- |\n')
                  f.write(f'| **Total Project Lines** | {total_lines:,} |\n')
                  f.write(f'| **Total Covered Lines** | {total_covered:,} |\n')
                  f.write(f'| **Total Missed Lines** | {total_missed:,} |\n')
                  f.write(f'| **Overall Line Coverage** | **{percentage}%** |\n')
                  
              print(f'Successfully processed report. Total lines matched: {total_lines:,}')
              
              # Enforce threshold gate natively
              if percentage < 80.0:
                  print(f'::error::Overall project coverage ({percentage}%) is below required threshold of 80%!')
                  exit(1)
                  
          except Exception as e:
              print(f'::error::Failed to parse custom JaCoCo XML: {str(e)}')
              exit(1)
          "

        
        
        
        # Optional: Enforce quality gate natively
        #if (( $(echo "$PERCENTAGE < 80.0" | bc -l) )); then
        #  echo "::error::Overall coverage ($PERCENTAGE%) is below required threshold of 80%!"
        #  exit 1
        #fi
        

        