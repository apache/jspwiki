name: Java CI

on: [push, pull_request]

#pull reqquest write is for adding comments to a PR
permissions:
  pull-requests: write
  contents: read

jobs:
  build:

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        # All LTS versions plus the current version, , 
        java: [ 17, 21, 25 ]
        experimental: [false]
#        include:
#          - java: 20-ea
#            os: ubuntu-latest
#            experimental: true        
#          - java: 20-ea
#            os: windows-latest
#            experimental: true        
#          - java: 20-ea
#            os: macos-latest
#            experimental: true        
      fail-fast: false
        
    steps:
    - uses: actions/checkout@v3
    - uses: actions/cache@v3
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}
    - name: Build with Maven
      run: mvn clean package -T 1C -V -B -Pintegration-tests -Dminimize=false "-Dplugin.surefire.junit5-tree-reporter.enable-console=true"
#    - name: Dependency scan
#      run: mvn org.sonatype.ossindex.maven:ossindex-maven-plugin:LATEST:audit
# token required
# Disabled due to some bug in the plugin
#    - name: Dependency scan
#      run: mvn install -B -T 1C -DskipTests=true org.owasp:dependency-check-maven:LATEST:check -DassemblyAnalyzerEnabled=false
    - name: generate jacoco aggregated
      run: mvn -Pgithubjacoco verify -N

      # --- Native Bash Script to Parse XML and create GitHub Summary ---
    - name: Generate Code Coverage Summary
      if: always() && runner.os == 'Linux'
      run: |
        REPORT_PATH="${{ github.workspace }}/target/site/jacoco-aggregate/jacoco.xml"
        
        if [ ! -f "$REPORT_PATH" ]; then
          echo "::error::JaCoCo XML report not found at $REPORT_PATH"
          exit 1
        fi
        # 1. Grab ALL global report counters located strictly inside the final </report> scope
        # The global project totals are always the very last <counter> entries before the closing </report> tag.
        GLOBAL_COUNTERS=$(grep '<counter type="LINE"' "$REPORT_PATH" | tail -n 1)

        if [ -z "$GLOBAL_COUNTERS" ]; then
           echo "::error::Could not find global Line Counter in JaCoCo XML"
           exit 1
        fi

        # 2. Extract values cleanly from the global project counter element
        MISSED=$(echo "$GLOBAL_COUNTERS" | sed -n 's/.*missed="\([0-9]*\)".*/\1/p')
        COVERED=$(echo "$GLOBAL_COUNTERS" | sed -n 's/.*covered="\([0-9]*\)".*/\1/p')
          
        TOTAL=$((MISSED + COVERED))
          
        if [ "$TOTAL" -gt 0 ]; then
          PERCENTAGE=$(awk "BEGIN {printf \"%.2f\", ($COVERED / $TOTAL) * 100}")
        else
          PERCENTAGE=0
        fi

        # Write natively to the GitHub Step Summary markdown file
        echo "### 📊 Code Coverage Summary" >> $GITHUB_STEP_SUMMARY
        echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
        echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
        echo "| **Total Covered Lines** | $COVERED |" >> $GITHUB_STEP_SUMMARY
        echo "| **Total Missed Lines** | $MISSED |" >> $GITHUB_STEP_SUMMARY
        echo "| **Overall Line Coverage** | **$PERCENTAGE%** |" >> $GITHUB_STEP_SUMMARY
        echo EOF >> $GITHUB_STEP_SUMMARY
        
        
        # Optional: Enforce quality gate natively
        #if (( $(echo "$PERCENTAGE < 80.0" | bc -l) )); then
        #  echo "::error::Overall coverage ($PERCENTAGE%) is below required threshold of 80%!"
        #  exit 1
        #fi
        

        