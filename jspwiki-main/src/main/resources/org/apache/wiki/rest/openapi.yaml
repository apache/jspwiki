# Description of the REST API of the wiki, JSPWIKI-1310. A test compares it with the answers of ApiV1Servlet.
openapi: 3.0.3
info:
  title: JSPWiki API
  version: 1.0.0
  description: Search of the pages the caller may view, page name suggestions and the installed plugins.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /search:
    get:
      operationId: searchPages
      summary: Search the pages the caller may view.
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/max'
      responses:
        '200':
          description: Matching pages, best match first. Empty when nothing matches.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /search/suggestions:
    get:
      operationId: suggestPages
      summary: Suggest the names of the pages that start with the given text and that the caller may view.
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/max'
      responses:
        '200':
          description: Page names. Empty when there is no suggestion.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /plugins:
    get:
      operationId: listPlugins
      summary: List the plugins discovered by the wiki, sorted by display name for the locale of the request.
      responses:
        '200':
          description: The plugins with an example of how to insert each one.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plugin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /pages/{name}:
    get:
      operationId: getPage
      summary: Read a page the caller may view, in the latest version or in the one asked for.
      parameters:
        - $ref: '#/components/parameters/name'
        - name: version
          in: query
          required: false
          description: Version of the page. The latest version when absent.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: The page with its markup.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /pages/{name}/history:
    get:
      operationId: getPageHistory
      summary: List the versions of a page the caller may view, the latest first.
      parameters:
        - $ref: '#/components/parameters/name'
      responses:
        '200':
          description: The versions of the page. A provider that does not keep old versions lists only the current one.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Revision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /pages/{name}/attachments:
    get:
      operationId: listPageAttachments
      summary: List the attachments of a page the caller may view, sorted by name.
      parameters:
        - $ref: '#/components/parameters/name'
      responses:
        '200':
          description: The attachments of the page. Empty when it has none or when attachments are disabled.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attachment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
  parameters:
    name:
      name: name
      in: path
      required: true
      description: Name of the page. A name with "..", a backslash or a control character is not valid.
      schema:
        type: string
        minLength: 1
    max:
      name: max
      in: query
      required: false
      description: Maximum number of entries to return.
      schema:
        type: integer
        minimum: 1
        default: 20
  schemas:
    SearchResult:
      type: object
      required: [page, score]
      properties:
        page:
          type: string
          description: Name of the page.
        score:
          type: integer
          description: Relevance of the page for the query. Higher is better.
    Page:
      type: object
      required: [name, version, text]
      properties:
        name:
          type: string
        version:
          type: integer
        author:
          type: string
        lastModified:
          type: string
          format: date-time
        text:
          type: string
          description: Wiki markup of the page, without any conversion.
    Revision:
      type: object
      required: [version]
      properties:
        version:
          type: integer
        author:
          type: string
        lastModified:
          type: string
          format: date-time
        changeNote:
          type: string
    Attachment:
      type: object
      required: [name, version, size]
      properties:
        name:
          type: string
          description: File name of the attachment.
        version:
          type: integer
        size:
          type: integer
          description: Size in bytes.
        author:
          type: string
        lastModified:
          type: string
          format: date-time
    Plugin:
      type: object
      required: [displayName, snip]
      properties:
        displayName:
          type: string
        snip:
          type: string
          description: Example of the markup that inserts the plugin.
    Error:
      type: object
      required: [status, message]
      properties:
        status:
          type: integer
        message:
          type: string
  responses:
    BadRequest:
      description: A required parameter is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: The caller is not authenticated and anonymous access is not allowed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The caller is authenticated but lacks the permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The page does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: The request could not be served because of an error of the wiki.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: The search index is not available, for instance right after the wiki has started.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
