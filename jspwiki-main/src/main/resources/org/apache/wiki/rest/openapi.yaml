# Description of the REST API of the wiki, JSPWIKI-1310. A test compares it with the answers of ApiV1Servlet.
openapi: 3.0.3
info:
  title: JSPWiki API
  version: 1.0.0
  description: Search of the pages the caller may view.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /search:
    get:
      operationId: searchPages
      summary: Search the pages the caller may view.
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/max'
      responses:
        '200':
          description: Matching pages, best match first. Empty when nothing matches.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
  parameters:
    max:
      name: max
      in: query
      required: false
      description: Maximum number of entries to return.
      schema:
        type: integer
        minimum: 1
        default: 20
  schemas:
    SearchResult:
      type: object
      required: [page, score]
      properties:
        page:
          type: string
          description: Name of the page.
        score:
          type: integer
          description: Relevance of the page for the query. Higher is better.
    Error:
      type: object
      required: [status, message]
      properties:
        status:
          type: integer
        message:
          type: string
  responses:
    BadRequest:
      description: A required parameter is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: The caller is not authenticated and anonymous access is not allowed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The caller is authenticated but lacks the permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: The request could not be served because of an error of the wiki.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: The search index is not available, for instance right after the wiki has started.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
